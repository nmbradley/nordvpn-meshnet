name: Docker Image CI

on:
  push:
    paths:
      - 'fs/**'
      - 'Dockerfile'
      - '.github/workflows/docker-image.yml'
    branches:
      - 'master'
  schedule:
    # Weekly: build only if NordVPN released a new client version
    - cron: '0 6 * * 1'
    # Monthly: unconditional rebuild to pick up base image security patches
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if the latest client version is already published'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Resolve latest NordVPN client version and decide whether to build
        id: resolve
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://repo.nordvpn.com/deb/nordvpn/debian/dists/stable/main/binary-amd64/Packages \
            | awk '/^Package: nordvpn$/{f=1} f && /^Version:/{print $2; f=0}' | sort -V | tail -1)
          [ -n "$VERSION" ] || { echo "Could not resolve NordVPN client version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest NordVPN client: $VERSION"

          # Returns success only if this version is already on GHCR; any
          # failure to check (e.g. package does not exist yet) means "build"
          published() {
            local image token status
            image=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
            token=$(curl -sSL "https://ghcr.io/token?scope=repository:${image}:pull" | jq -r '.token // empty' || true)
            [ -n "$token" ] || return 1
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${image}/manifests/${VERSION}" || echo 000)
            [ "$status" = "200" ]
          }

          # Everything except the weekly check and un-forced manual runs
          # builds unconditionally
          BUILD=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 6 * * 1" ] && published; then
            BUILD=false
            echo "Version ${VERSION} already published, skipping build."
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "true" ] && published; then
            BUILD=false
            echo "Version ${VERSION} already published, skipping build (use force to override)."
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  smoke-test:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build test image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: smoke-test:local
          build-args: |
            NORDVPN_CLIENT_VERSION=${{ needs.check.outputs.version }}

      - name: Login and join Meshnet
        env:
          NORDVPN_TOKEN: ${{ secrets.NORDVPN_TOKEN }}
        run: |
          set -euo pipefail
          # Stable hostname: every CI run shows up as this same Meshnet
          # device instead of registering a new random peer each time
          docker run -d --name smoke \
            --hostname github-ci-smoke \
            --cap-add NET_ADMIN --cap-add NET_RAW \
            -e NORDVPN_TOKEN \
            smoke-test:local

          echo "Waiting for login and Meshnet to come up..."
          for i in $(seq 1 30); do
            if docker exec smoke nordvpn meshnet peer list >/dev/null 2>&1; then
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "Container exited prematurely"; docker logs smoke; exit 1
            fi
            sleep 5
          done

          docker exec smoke nordvpn account | grep -q 'Email address' \
            || { echo 'Login failed'; docker logs smoke; exit 1; }
          docker exec smoke nordvpn meshnet peer list >/dev/null 2>&1 \
            || { echo 'Meshnet peer list failed'; docker logs smoke; exit 1; }
          echo "Smoke test passed: logged in and joined Meshnet."

      - name: Restart with saved login (repeated logins)
        run: |
          set -euo pipefail
          # A real server keeps /var/lib/nordvpn between restarts, so every
          # restart starts with a saved login. `docker restart` keeps the
          # container's filesystem, which reproduces that. Do it twice so the
          # login script is proven to cope with a saved login repeatedly.
          for round in 1 2; do
            echo "Restart ${round}: starting again with a saved login..."
            docker restart smoke

            ok=false
            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
                echo "Container exited after restart ${round}"; docker logs --tail 50 smoke; exit 1
              fi
              if docker exec smoke nordvpn meshnet peer list >/dev/null 2>&1; then
                ok=true; break
              fi
              sleep 5
            done
            [ "$ok" = "true" ] \
              || { echo "Meshnet did not come back after restart ${round}"; docker logs --tail 50 smoke; exit 1; }

            # The daemon can answer for a moment before a failing login script
            # exits, so make sure the container is still up a little later.
            sleep 15
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = "true" ] \
              || { echo "Container stopped after restart ${round}"; docker logs --tail 50 smoke; exit 1; }

            docker exec smoke nordvpn account | grep -q 'Email address' \
              || { echo "Not logged in after restart ${round}"; docker logs --tail 50 smoke; exit 1; }
          done
          echo "Restart check passed: the saved login survives repeated restarts."

      - name: Deregister test device
        if: always()
        run: docker exec smoke nordvpn logout || true

  build-push:
    runs-on: ubuntu-latest
    needs: [check, smoke-test]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.check.outputs.version }}
            type=raw,value=latest

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NORDVPN_CLIENT_VERSION=${{ needs.check.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}